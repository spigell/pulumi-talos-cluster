anchors:
  patches:
    machineBase: &machineBase |
      debug: false
      machine:
        kubelet:
          nodeIP:
            validSubnets:
              - 10.10.10.0/24
        time:
          disabled: true
    controlplaneCluster: &controlplaneCluster |
      cluster:
        etcd:
          advertisedSubnets:
            - 10.10.10.0/24
    controlplane: &controlplanePatches
      - *machineBase
      - *controlplaneCluster
    worker: &workerPatches
      - *machineBase

  machineDefaults: &machineDefaults
    platform: hcloud
    variant: metal
    talosImage: factory.talos.dev/installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.12.0
    apply-config-via-userdata: false
    hcloud:
      serverType: cx23

  controlplaneDefaults: &controlplaneDefaults
    <<: *machineDefaults
    type: controlplane
    configPatches: *controlplanePatches

  workerDefaults: &workerDefaults
    <<: *machineDefaults
    type: worker
    configPatches: *workerPatches

name: hcloud-ha-py
kubernetesVersion: v1.31.0
usePrivateNetwork: true
privateNetwork: 10.10.10.0/24
privateSubnetwork: 10.10.10.0/25
machines:
  - <<: *controlplaneDefaults
    id: hcloud-ha-py-controlplane-1
    type: init
    privateIP: 10.10.10.5
    configPatches:
      - *machineBase
      - *controlplaneCluster
      - |
        apiVersion: v1alpha1
        kind: HostnameConfig
        hostname: hcloud-ha-py-controlplane-1
        auto: off
  - <<: *controlplaneDefaults
    id: hcloud-ha-py-controlplane-2
    privateIP: 10.10.10.2
    configPatches:
      - *machineBase
      - *controlplaneCluster
      - |
        apiVersion: v1alpha1
        kind: HostnameConfig
        hostname: hcloud-ha-py-controlplane-2
        auto: off
  - <<: *controlplaneDefaults
    id: hcloud-ha-py-controlplane-3
    privateIP: 10.10.10.10
    configPatches:
      - *machineBase
      - *controlplaneCluster
      - |
        apiVersion: v1alpha1
        kind: HostnameConfig
        hostname: hcloud-ha-py-controlplane-3
        auto: off
  - <<: *workerDefaults
    id: hcloud-ha-py-worker-1
    privateIP: 10.10.10.3
    configPatches:
      - *machineBase
      - |
        apiVersion: v1alpha1
        kind: HostnameConfig
        hostname: hcloud-ha-py-worker-1
        auto: off
